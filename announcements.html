<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --deep-blue: #0A192F;
    --light-gray: #F5F7FA;
    --white: #FFFFFF;
    --text-dark: #1F2933;
    --link-blue: #007BFF;
    --link-hover: #0056B3;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    overflow-x: hidden;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--light-gray);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    scroll-behavior: smooth;
}

.page-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* ================= HEADER (EXACT SIZE FROM EVENTS PAGE) ================= */

.header {
    background-color: var(--deep-blue);
    color: var(--white);
    width: 100%;
}

.header-container {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
    padding: 30px 0 20px;
}

.school-title h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 42px;
    color: var(--white);
    margin: 0;
    line-height: 1.2;
}

.school-title p {
    font-size: 18px;
    color: var(--light-gray);
    margin-top: 5px;
    line-height: 1.5;
}

/* ================= NAVBAR (EXACT SIZE FROM EVENTS PAGE) ================= */

.navbar {
    background-color: #081423;
    text-align: center;
    padding: 15px 0;
    width: 100%;
}

.nav-btn {
    color: var(--white);
    text-decoration: none;
    margin: 0 10px;
    padding: 10px 15px;
    border-radius: 5px;
    transition: 0.3s;
    display: inline-block;
    font-weight: 500;
    font-size: 0.95rem;
    line-height: 1.4;
}

.nav-btn:hover {
    background-color: rgba(255,255,255,0.1);
    color: #4da3ff;
}

.nav-btn.active {
    border-bottom: 2px solid #4da3ff;
}

/* ================= MAIN CONTENT ================= */

.container {
    width: 90%;
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

.page-heading {
    text-align: center;
    margin-bottom: 4rem;
}

.page-heading h1 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.5rem, 6vw, 3.5rem);
    color: var(--deep-blue);
    margin-bottom: 1rem;
}

.page-heading p {
    font-size: 1.25rem;
    color: #666;
    max-width: 600px;
    margin: 0 auto 3rem;
    line-height: 1.7;
}

/* ================= FOOTER (EXACT SIZE FROM EVENTS PAGE) ================= */

.footer {
    background-color: var(--deep-blue);
    color: var(--white);
    text-align: center;
    padding: 25px 0;
    font-size: 14px;
    border-top: 1px solid rgba(255,255,255,0.1);
    width: 100%;
    margin-top: auto;
}

.footer a {
    color: #4da3ff;
    text-decoration: none;
    font-weight: 500;
}

.footer a:hover {
    text-decoration: underline;
    color: var(--white);
}

/* ================= RESPONSIVE ================= */

@media (max-width: 768px) {
    .header-container {
        padding: 20px 0 15px;
    }

    .school-title h1 {
        font-size: 32px;
    }

    .school-title p {
        font-size: 16px;
    }

    .navbar {
        padding: 10px 0;
    }

    .nav-btn {
        display: block;
        margin: 5px auto;
        padding: 8px 12px;
        font-size: 0.9rem;
        width: fit-content;
    }

    .container {
        width: 95%;
        margin: 20px auto;
    }
}
</style>
</head>

<body>
<div class="page-wrapper">

<!-- ================= HEADER ================= -->
<header class="header">
    <div class="header-container">
        <div class="school-title">
            <h1>La Concepcion College</h1>
            <p>Information Technology Division</p>
        </div>
    </div>
</header>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="events.html" class="nav-btn">Events</a>
    <a href="announcements.html" class="nav-btn active">Announcements</a>
    <a href="calendar.html" class="nav-btn">School Calendar</a>
    <a href="organization.html" class="nav-btn">Organization</a>
</nav>

<!-- ================= MAIN CONTENT ================= -->
<main class="container">
    <div class="page-heading">
        <h1>Announcements</h1>
        <p>No announcements</p>
    </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
    <p>
        🌐 <a href="https://laconcepcioncollege.com/" target="_blank">
        www.laconcepcioncollege.com</a>
    </p>
    <p>&copy; 2026 La Concepcion College - IT Division</p>
</footer>

</div>
</body>
</html>
